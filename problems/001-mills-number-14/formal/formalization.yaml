    authors: ["Troy Valiyaparampil"]
    type: preprint
    relationship: formalizes
    id: https://github.com/troytsv/project-lemma/releases/tag/mills-14-v1.0.0
    note: >-
      The preprint and original Lean proofs were released together. The human author
      initiated and directed the project. The models selected the question and
      developed the argument, formalization and manuscript.
  - title: "Covering pairs by q² + q + 1 sets"
    authors: ["Zoltán Füredi"]
    relationship: background
    id: https://doi.org/10.1016/0097-3165(90)90034-T
    note: Source of the conjecture. Only its q = 3 case is claimed.
  - title: "A fourteen-block covering of 69 points by 21-subsets"
    authors: ["Colin Barker"]
    relationship: adapts
    id: https://doi.org/10.5281/zenodo.24119701
    note: The 2008 covering in the La Jolla archive supplies the attaining construction.
  - title: "Covering design with 15 blocks for C(70,21,2)"
    authors: ["Arhan Canli"]
    relationship: adapts
    id: https://quantavane.com/results/coverings/c-70-21-2/
    note: The incidence columns certify the upper bound for the 70-point family.
