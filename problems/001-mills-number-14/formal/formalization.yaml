status:
  scope: >-
    The Challenge specifies all seven results in finite-set and real-number notation.
    Pair covering counts use indexed blocks, allow repetitions and quantify over distinct
    point pairs. The general lower bound permits smaller blocks. The two exact minima
    require exact block sizes. The interpretation as an all-to-all data limit follows
    the mathematical model in the paper.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
    - method: agent
      models: ["OpenAI GPT-6.2 Astra", "OpenAI GPT-6.2 Sol"]
      framework: OpenAI Codex
      tool_setup: "Lean 4, Mathlib, exact finite certificates and independently implemented integer checkers."
  spend_usd: "Commercial subscription; per-result cost untracked."
  notes: >-
    Troy Valiyaparampil initiated and directed the research and requested the formal
    checks. The models selected and framed the question, proposed and proved the
    mathematical claims, implemented the experiments and proofs, and prepared the text.
fidelity:
