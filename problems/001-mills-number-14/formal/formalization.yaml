version: "v0.4"
project:
  name: "The first Mills number on fourteen vertices"
  description: >-
    An intersecting family of subsets of fourteen vertices with nonnegative weights
    of total mass one has a vertex of load at least 7/23. This bound is attained.
    Equivalently, the greatest fractional matching mass under unit vertex capacities
    is 23/7. These equalities give the q = 3 case of Füredi's conjecture.
    Pair coverings by blocks of size at most k need at least fifteen blocks when
    7v > 23k and v ≥ 2. The exact minima for (70n,21n) and (69n,21n)
    are fifteen and fourteen respectively for every positive integer n.
  authors: ["OpenAI GPT-6.2 Astra and GPT-6.2 Sol (formalization via Codex)"]
  responsible_maintainers: ["Troy Valiyaparampil"]
  license: MIT
classification:
  arxiv: [math.CO]
  msc2020: [05B40, 05C65]
sources:
