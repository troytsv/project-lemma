name: Verify Project Lemma

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  certificates:
    name: Certificate and exact arithmetic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.5'
      - name: Verify the 15-block certificate and numerical cases
        run: |
          python verify_pairs.py baseline/known15.txt
          python search/verify_dual.py baseline/known15.txt
          python -B -m unittest discover -s search -v
          python check_ranks.py

  lean:
    name: Lean proof and axiom audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install the pinned Lean release
        shell: bash
        run: |
          archive=lean-4.24.0-linux.tar.zst
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/leanprover/lean4/releases/download/v4.24.0/$archive"
          printf '%s  %s\n' b14f5e5159219dd1a1956c3b806813319f5e94ccd5bdfd56f54520609a5bb5ec \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          tar --extract --zstd --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.24.0-linux/bin" >> "$GITHUB_PATH"
      - name: Retrieve the pinned mathlib build cache
        run: lake exe cache get Mathlib.Tactic Mathlib.LinearAlgebra.FiniteDimensional.Basic Mathlib.LinearAlgebra.Dimension.Constructions
      - name: Build the proof
        run: lake build
      - name: Check the theorem statement and axiom dependencies
        run: lake env lean -DwarningAsError=true Audit.lean
